<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocalAssistAI - Vernacular Routing & Resolution Engine</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --surface-bg: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.1);
      --surface-hover: rgba(51, 65, 85, 0.8);
      
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-glow: rgba(99, 102, 241, 0.3);
      
      --accent-teal: #14b8a6;
      --accent-purple: #a855f7;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      
      --shadow-glow: 0 0 25px rgba(99, 102, 241, 0.15);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* App Shell Layout */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header Styling */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--primary)); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 10px var(--accent-purple)); }
    }

    .brand-title h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--accent-teal);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .nav-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--surface-border);
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.55rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .live-badge {
      background: rgba(20, 184, 166, 0.15);
      border: 1px solid rgba(20, 184, 166, 0.4);
      color: var(--accent-teal);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-teal);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-teal);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* Stat Cards Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: var(--shadow-glow);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .stat-card.total::before { background: var(--primary); }
    .stat-card.new::before { background: var(--accent-rose); }
    .stat-card.progress::before { background: var(--accent-amber); }
    .stat-card.resolved::before { background: var(--accent-teal); }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .stat-top h4 {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-icon {
      font-size: 1.3rem;
      opacity: 0.8;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.03em;
    }

    .stat-sub {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
    }

    /* Layout Workspace */
    .workspace-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.75rem;
    }

    /* Sidebar Filters */
    .filter-panel {
      background: var(--surface-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      height: fit-content;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    .form-control, select.form-control {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.85rem;
      color: var(--text-main);
      font-size: 0.88rem;
      font-family: inherit;
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    /* Ticket Grid Feed */
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .feed-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .tickets-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .ticket-card {
      background: var(--surface-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .ticket-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-light);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .channel-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .channel-badge.whatsapp {
      background: rgba(37, 211, 102, 0.15);
      color: #25d366;
      border: 1px solid rgba(37, 211, 102, 0.3);
    }

    .channel-badge.email {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .badge-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .tag-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
    }

    .badge-hi { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-te { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .badge-ta { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }
    .badge-hinglish { background: rgba(20, 184, 166, 0.2); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.4); }

    .status-new { background: rgba(244, 63, 94, 0.2); color: #f87171; }
    .status-progress { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .status-resolved { background: rgba(20, 184, 166, 0.2); color: #34d399; }

    .urgency-critical { background: #e11d48; color: #ffffff; font-weight: 800; }
    .urgency-high { background: #f97316; color: #ffffff; }
    .urgency-medium { background: #eab308; color: #000000; }

    .ticket-title {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .ticket-snippet {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.4);
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--primary-light);
    }

    .ticket-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.75rem;
    }

    /* Ticket Detail Modal / Page */
    .detail-view {
      background: var(--surface-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .back-link {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.75rem;
    }

    .translation-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .translation-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
    }

    .translation-box h4 {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .translation-text {
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    .pinecone-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.08);
    }

    .pinecone-card h3 {
      font-size: 0.95rem;
      color: var(--accent-purple);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .resolution-item {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 0.85rem;
      margin-bottom: 0.75rem;
      font-size: 0.82rem;
    }

    .resolution-item strong {
      color: var(--primary-light);
    }

    .resolution-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-copy {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .rate-btn {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .rate-btn.active {
      background: rgba(20, 184, 166, 0.2);
      border-color: var(--accent-teal);
      color: var(--accent-teal);
    }

    /* Draft Reply Editor */
    .editor-section {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-top: 1.5rem;
    }

    .editor-section h3 {
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    textarea.reply-input {
      width: 100%;
      height: 110px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 0.85rem;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      margin-bottom: 1rem;
    }

    textarea.reply-input:focus {
      outline: none;
      border-color: var(--primary-light);
    }

    .btn-send {
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      color: white;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-send:hover {
      box-shadow: 0 4px 16px var(--primary-glow);
      transform: translateY(-2px);
    }

    .toast-alert {
      background: rgba(20, 184, 166, 0.2);
      border: 1px solid var(--accent-teal);
      color: #5eead4;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.25rem;
      font-weight: 600;
    }

    /* Simulator Tab */
    .simulator-card {
      background: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .mic-button {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      border: none;
      color: white;
      font-size: 2.2rem;
      cursor: pointer;
      margin: 1.5rem 0;
      transition: var(--transition);
      box-shadow: 0 0 30px var(--primary-glow);
    }

    .mic-button.recording {
      animation: pulseRecord 1.2s infinite;
      background: linear-gradient(135deg, var(--accent-rose), #e11d48);
    }

    @keyframes pulseRecord {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
      70% { box-shadow: 0 0 0 25px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }

    /* Settings Tab */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .settings-card {
      background: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
    }

    .settings-card h3 {
      font-size: 1.1rem;
      margin-bottom: 1.25rem;
      color: var(--primary-light);
    }

    footer {
      border-top: 1px solid var(--surface-border);
      padding: 1.25rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      background: rgba(15, 23, 42, 0.9);
    }
  </style>
</head>

        status: 'In Progress',
        createdAt: '5 hours ago',
        draftReply: 'அன்புள்ள ஸ்ரீனிவாஸ் பிள்ளை, உங்கள் தயாரிப்பு சேதமடைந்ததற்கு வருந்துகிறோம். மாற்று தயாரிப்பு ஆர்டர் செய்யப்பட்டுள்ளது.'
      },
      {
        _id: 'ticket-104',
        channel: 'WhatsApp',
        customerName: 'Vikram Singh',
        customerContact: '+91 90123 45678',
        originalLanguage: 'hinglish',
        subject: 'Bank Refund Reflection',
        rawContent: 'Hi team, refund kab tak aayega? Kal cancel kiya tha order, bank statement me abhi tak show nahi kar raha.',
        translatedContent: 'Hi team, when will the refund arrive? Canceled the order yesterday, not showing in bank statement yet.',
        category: 'Refund',
        urgency: 'Medium',
        location: 'Gurgaon, Haryana',
        status: 'Resolved',
        createdAt: '1 day ago',
        draftReply: 'Hi Vikram, refund process ho gaya hai. Normal banking cycles ke according 24-48 hours me credit ho jayega.'
      }
    ];

    const PINECONE_DB = {
      Delivery: [
        { id: 'vec-d1', query: 'Delayed package at Noida hub', resolution: 'Rescheduled courier delivery via partner dashboard. Customer notified of updated timeframe.' },
        { id: 'vec-d2', query: 'Address update in transit', resolution: 'Updated address tag on Airtable and notified logistics provider.' }
      ],
      Refund: [
        { id: 'vec-r1', query: 'Refund not reflected in bank account', resolution: 'Verified payment gateway transaction status. Refund reference ID generated and shared.' },
        { id: 'vec-r2', query: 'Wrong product size return', resolution: 'Initiated reverse pickup request. Refund triggered upon pickup scanner sync.' }
      ],
      Product: [
        { id: 'vec-p1', query: 'Damaged item box upon arrival', resolution: 'Verified unboxing photo. Replacement order created free of charge.' }
      ]
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [tickets, setTickets] = useState(MOCK_TICKETS);
      const [selectedTicket, setSelectedTicket] = useState(null);
      
      // Filters
      const [statusFilter, setStatusFilter] = useState('All');
      const [channelFilter, setChannelFilter] = useState('All');
      const [urgencyFilter, setUrgencyFilter] = useState('All');
      const [langFilter, setLangFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      // Voice Simulator State
      const [isRecording, setIsRecording] = useState(false);
      const [simulatedVoiceText, setSimulatedVoiceText] = useState('');
      const [voiceLanguage, setVoiceLanguage] = useState('hi');

      // Toast Notification
      const [toastMessage, setToastMessage] = useState('');

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 4000);
      };

      const handleUpdateTicketStatus = (id, newStatus) => {
        setTickets(prev => prev.map(t => t._id === id ? { ...t, status: newStatus } : t));
        if (selectedTicket && selectedTicket._id === id) {
          setSelectedTicket(prev => ({ ...prev, status: newStatus }));
        }
      };

      const handleUpdateTicketCategory = (id, newCategory) => {
        setTickets(prev => prev.map(t => t._id === id ? { ...t, category: newCategory } : t));
        if (selectedTicket && selectedTicket._id === id) {
          setSelectedTicket(prev => ({ ...prev, category: newCategory }));
        }
      };

      const handleSendReply = (ticketId, replyText) => {
        handleUpdateTicketStatus(ticketId, 'Resolved');
        triggerToast(`Reply sent successfully to customer via ${selectedTicket.channel}!`);
      };

      const handleSimulateVoiceInput = () => {
        if (isRecording) {
          setIsRecording(false);
          // Auto add new ticket
          const newTicket = {
            _id: `ticket-${Date.now()}`,
            channel: 'WhatsApp',
            customerName: 'Voice Customer (Live Demo)',
            customerContact: '+91 91234 56789',
            originalLanguage: voiceLanguage,
            subject: 'Voice Order Assistance',
            rawContent: simulatedVoiceText || 'Mera order cancel karke dusra size bhej do kripya.',
            translatedContent: 'Please cancel my order and send another size.',
            category: 'Refund',
            urgency: 'High',
            location: 'Bengaluru, Karnataka',
            status: 'New',
            createdAt: 'Just now',
            draftReply: 'आपका वॉइस संदेश प्राप्त हुआ है। हम आकार बदलने के लिए प्रतिस्थापन की प्रक्रिया शुरू कर रहे हैं।'
          };
          setTickets([newTicket, ...tickets]);
          triggerToast('Voice recording processed! New ticket routed to Dashboard.');
          setActiveTab('dashboard');
        } else {
          setIsRecording(true);
          setSimulatedVoiceText('Mera order cancel karke dusra size bhej do kripya.');
        }
      };

      // Filter logic
      const filteredTickets = tickets.filter(t => {
        const matchStatus = statusFilter === 'All' || t.status === statusFilter;
        const matchChannel = channelFilter === 'All' || t.channel === channelFilter;
        const matchUrgency = urgencyFilter === 'All' || t.urgency === urgencyFilter;
        const matchLang = langFilter === 'All' || t.originalLanguage === langFilter;
        const matchSearch = !searchQuery || t.location.toLowerCase().includes(searchQuery.toLowerCase()) || t.customerName.toLowerCase().includes(searchQuery.toLowerCase());
        return matchStatus && matchChannel && matchUrgency && matchLang && matchSearch;
      });

      // Stats
      const totalCount = tickets.length;
      const newCount = tickets.filter(t => t.status === 'New').length;
      const progressCount = tickets.filter(t => t.status === 'In Progress').length;
      const resolvedCount = tickets.filter(t => t.status === 'Resolved').length;

      return (
        <div className="app-wrapper">
          {/* Top Header */}
          <header>
            <div className="brand">
              <span className="brand-logo">✨</span>
              <div className="brand-title">
                <h1>VocalAssistAI</h1>
                <p>Vernacular Routing & Resolution Engine</p>
              </div>
            </div>

            <nav className="nav-tabs">
              <button 
                className={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`}
                onClick={() => { setActiveTab('dashboard'); setSelectedTicket(null); }}
              >
                📊 Dashboard
              </button>
              <button 
                className={`tab-btn ${activeTab === 'simulator' ? 'active' : ''}`}
                onClick={() => setActiveTab('simulator')}
              >
                🎙️ Voice Simulator
              </button>
              <button 
                className={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`}
                onClick={() => setActiveTab('settings')}
              >
                ⚙️ Integration Settings
              </button>
            </nav>

            <div className="live-badge">
              <span className="live-dot"></span>
              Pinecone Vector DB: Active
            </div>
          </header>

          <main>
            {/* DASHBOARD TAB */}
            {activeTab === 'dashboard' && !selectedTicket && (
              <div>
                {/* Stats */}
                <div className="stats-grid">
                  <div className="stat-card total">
                    <div className="stat-top">
                      <h4>Total Tickets</h4>
                      <span className="stat-icon">📑</span>
                    </div>
                    <div className="stat-value">{totalCount}</div>
                    <div className="stat-sub">Across WhatsApp & Email</div>
                  </div>

                  <div className="stat-card new">
                    <div className="stat-top">
                      <h4>New Alerts</h4>
                      <span className="stat-icon">🔔</span>
                    </div>
                    <div className="stat-value">{newCount}</div>
                    <div className="stat-sub">Requires urgent review</div>
                  </div>

                  <div className="stat-card progress">
                    <div className="stat-top">
                      <h4>Active Queue</h4>
                      <span className="stat-icon">⏳</span>
                    </div>
                    <div className="stat-value">{progressCount}</div>
                    <div className="stat-sub">In-progress tickets</div>
                  </div>

                  <div className="stat-card resolved">
                    <div className="stat-top">
                      <h4>Resolved</h4>
                      <span className="stat-icon">✅</span>
                    </div>
                    <div className="stat-value">{resolvedCount}</div>
                    <div className="stat-sub">Vector similarity matched</div>
                  </div>
                </div>

                {/* Workspace Grid */}
                <div className="workspace-grid">
                  {/* Filters Sidebar */}
                  <div className="filter-panel">
                    <div className="panel-title">
                      <span>Filters & Parameters</span>
                      <span style={{fontSize: '0.8rem', color: 'var(--text-dim)'}}>Live Sync</span>
                    </div>

                    <div className="form-group">
                      <label>Channel</label>
                      <select className="form-control" value={channelFilter} onChange={e => setChannelFilter(e.target.value)}>
                        <option value="All">All Channels</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Email">Email</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Status</label>
                      <select className="form-control" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                        <option value="All">All Statuses</option>
                        <option value="New">New</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Urgency Level</label>
                      <select className="form-control" value={urgencyFilter} onChange={e => setUrgencyFilter(e.target.value)}>
                        <option value="All">All Urgencies</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Language Filter</label>
                      <select className="form-control" value={langFilter} onChange={e => setLangFilter(e.target.value)}>
                        <option value="All">All Vernacular</option>
                        <option value="hi">Hindi (hi)</option>
                        <option value="te">Telugu (te)</option>
                        <option value="ta">Tamil (ta)</option>
                        <option value="hinglish">Hinglish</option>
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Search Customer / Location</label>
                      <input 
                        type="text" 
                        className="form-control" 
                        placeholder="Search Noida, Rajesh..." 
                        value={searchQuery}
                        onChange={e => setSearchQuery(e.target.value)}
                      />
                    </div>
                  </div>

                  {/* Feed Section */}
                  <div>
                    <div className="feed-header">
                      <h2>Multilingual Resolution Feed ({filteredTickets.length})</h2>
                    </div>

                    <div className="tickets-container">
                      {filteredTickets.map(ticket => (
                        <div 
                          key={ticket._id} 
                          className="ticket-card"
                          onClick={() => setSelectedTicket(ticket)}
                        >
                          <div>
                            <div className="ticket-header">
                              <span className={`channel-badge ${ticket.channel.toLowerCase()}`}>
                                {ticket.channel === 'WhatsApp' ? '💬 WhatsApp' : '✉️ Email'}
                              </span>
                              <div className="badge-group">
                                <span className={`tag-badge badge-${ticket.originalLanguage}`}>
                                  {ticket.originalLanguage.toUpperCase()}
                                </span>
                                <span className={`tag-badge status-${ticket.status.toLowerCase().replace(' ', '')}`}>
                                  {ticket.status}
                                </span>
                                <span className={`tag-badge urgency-${ticket.urgency.toLowerCase()}`}>
                                  {ticket.urgency}
                                </span>
                              </div>
                            </div>

                            <div className="ticket-title">{ticket.subject}</div>
                            <div className="ticket-snippet">"{ticket.rawContent}"</div>
                          </div>

                          <div className="ticket-meta">
                            <span>👤 {ticket.customerName}</span>
                            <span>📍 {ticket.location}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TICKET DETAIL VIEW */}
            {selectedTicket && (
              <div className="detail-view">
                <div className="detail-top-nav">
                  <button className="back-link" onClick={() => setSelectedTicket(null)}>
                    ← Return to Ticket Board
                  </button>
                  <div style={{display: 'flex', gap: '0.75rem', alignItems: 'center'}}>
                    <span className={`tag-badge urgency-${selectedTicket.urgency.toLowerCase()}`}>
                      {selectedTicket.urgency} Urgency
                    </span>
                    <span className="customer-info" style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>
                      Ticket ID: {selectedTicket._id}
                    </span>
                  </div>
                </div>

                {toastMessage && (
                  <div className="toast-alert">
                    ✅ {toastMessage}
                  </div>
                )}

                <h2 style={{fontSize: '1.4rem', marginBottom: '0.25rem'}}>{selectedTicket.subject}</h2>
                <p style={{color: 'var(--text-muted)', marginBottom: '1.5rem'}}>
                  Customer: <strong>{selectedTicket.customerName}</strong> ({selectedTicket.customerContact}) • Location: {selectedTicket.location}
                </p>

                <div className="detail-grid">
                  <div>
                    {/* Translation Panel */}
                    <div className="translation-comparison">
                      <div className="translation-box">
                        <h4>
                          Original Vernacular Message
                          <span className={`tag-badge badge-${selectedTicket.originalLanguage}`}>
                            {selectedTicket.originalLanguage.toUpperCase()}
                          </span>
                        </h4>
                        <p className="translation-text">{selectedTicket.rawContent}</p>
                      </div>

                      <div className="translation-box">
                        <h4>
                          Gemini 2.5 English Translation
                          <span style={{color: 'var(--accent-teal)', fontSize: '0.75rem'}}>AI Processed</span>
                        </h4>
                        <p className="translation-text">{selectedTicket.translatedContent}</p>
                      </div>
                    </div>

                    {/* Status & Category controls */}
                    <div style={{display: 'flex', gap: '1.5rem', marginBottom: '1.5rem'}}>
                      <div style={{flex: 1}}>
                        <label style={{fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-muted)'}}>UPDATE STATUS</label>
                        <select 
                          className="form-control" 
                          value={selectedTicket.status}
                          onChange={e => handleUpdateTicketStatus(selectedTicket._id, e.target.value)}
                        >
                          <option value="New">New</option>
                          <option value="In Progress">In Progress</option>
                          <option value="Resolved">Resolved</option>
                        </select>
                      </div>

                      <div style={{flex: 1}}>
                        <label style={{fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-muted)'}}>CATEGORY ROUTING</label>
                        <select 
                          className="form-control" 
                          value={selectedTicket.category}
                          onChange={e => handleUpdateTicketCategory(selectedTicket._id, e.target.value)}
                        >
                          <option value="Delivery">Delivery</option>
                          <option value="Refund">Refund</option>
                          <option value="Product">Product</option>
                        </select>
                      </div>
                    </div>

                    {/* Reply Editor */}
                    <div className="editor-section">
                      <h3>Draft AI Response ({selectedTicket.originalLanguage.toUpperCase()} Vernacular)</h3>
                      <textarea 
                        className="reply-input"
                        value={selectedTicket.draftReply}
                        onChange={e => setSelectedTicket({...selectedTicket, draftReply: e.target.value})}
                      />
                      <button 
                        className="btn-send"
                        onClick={() => handleSendReply(selectedTicket._id, selectedTicket.draftReply)}
                      >
                        🚀 Dispatch Response via {selectedTicket.channel}
                      </button>
                    </div>
                  </div>

                  {/* Pinecone Vector Matches Sidebar */}
                  <div>
                    <div className="pinecone-card">
                      <h3>🌲 Pinecone Similarity Matches</h3>
                      <p style={{fontSize: '0.78rem', color: 'var(--text-muted)', marginBottom: '1rem'}}>
                        Vector search retrieved top historical resolutions for <strong>{selectedTicket.category}</strong>:
                      </p>

                      {(PINECONE_DB[selectedTicket.category] || PINECONE_DB.Delivery).map(item => (
                        <div key={item.id} className="resolution-item">
                          <div><strong>Match:</strong> "{item.query}"</div>
                          <div style={{marginTop: '0.25rem'}}><strong>Resolution:</strong> {item.resolution}</div>
                          <div className="resolution-actions">
                            <div style={{display: 'flex', gap: '0.3rem'}}>
                              <button className="rate-btn">👍 Useful</button>
                              <button className="rate-btn">👎 Not Useful</button>
                            </div>
                            <button 
                              className="btn-copy"
                              onClick={() => {
                                setSelectedTicket(prev => ({
                                  ...prev,
                                  draftReply: prev.draftReply + '\n' + item.resolution
                                }));
                              }}
                            >
                              Copy Resolution
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* VOICE SIMULATOR TAB */}
            {activeTab === 'simulator' && (
              <div className="simulator-card">
                <h2>🎙️ Vernacular Voice Assistant Simulator</h2>
                <p style={{color: 'var(--text-muted)', marginTop: '0.5rem', marginBottom: '1.5rem'}}>
                  Simulate voice notes received via WhatsApp or Phone Calls. Our STT model automatically transcribes & translates the audio.
                </p>

                <div className="form-group" style={{maxWidth: '300px', margin: '0 auto 1.5rem'}}>
                  <label>Select Target Language</label>
                  <select className="form-control" value={voiceLanguage} onChange={e => setVoiceLanguage(e.target.value)}>
                    <option value="hi">Hindi (हिंदी)</option>
                    <option value="te">Telugu (తెలుగు)</option>
                    <option value="ta">Tamil (தமிழ்)</option>
                    <option value="hinglish">Hinglish</option>
                  </select>
                </div>

                <button 
                  className={`mic-button ${isRecording ? 'recording' : ''}`}
                  onClick={handleSimulateVoiceInput}
                >
                  {isRecording ? '⏹️' : '🎙️'}
                </button>

                <p style={{fontSize: '0.9rem', color: isRecording ? 'var(--accent-rose)' : 'var(--text-dim)', fontWeight: 600}}>
                  {isRecording ? 'Recording audio stream... Click to process STT' : 'Click to start recording voice note simulation'}
                </p>
              </div>
            )}

            {/* INTEGRATION SETTINGS TAB */}
            {activeTab === 'settings' && (
              <div>
                <h2 style={{fontSize: '1.4rem', marginBottom: '1.5rem'}}>⚙️ Engine Integration Parameters</h2>
                <div className="settings-grid">
                  <div className="settings-card">
                    <h3>🌲 Pinecone Vector Index</h3>
                    <div className="form-group">
                      <label>API Key</label>
                      <input type="password" className="form-control" value="••••••••••••••••••••" readOnly />
                    </div>
                    <div className="form-group">
                      <label>Index Name</label>
                      <input type="text" className="form-control" value="vocal-ai-resolutions" readOnly />
                    </div>
                    <div className="form-group">
                      <label>Vector Dimension</label>
                      <input type="text" className="form-control" value="768 (text-embedding-004)" readOnly />
                    </div>
                  </div>

                  <div className="settings-card">
                    <h3>✨ Gemini LLM Config</h3>
                    <div className="form-group">
                      <label>Model Version</label>
                      <input type="text" className="form-control" value="gemini-2.5-flash" readOnly />
                    </div>
                    <div className="form-group">
                      <label>Vernacular Languages Enabled</label>
                      <input type="text" className="form-control" value="Hindi, Tamil, Telugu, Kannada, Hinglish" readOnly />
                    </div>
                  </div>

                  <div className="settings-card">
                    <h3>📊 Airtable & n8n Sync</h3>
                    <div className="form-group">
                      <label>Airtable Base ID</label>
                      <input type="text" className="form-control" value="appVocalAssist2026" readOnly />
                    </div>
                    <div className="form-group">
                      <label>n8n Webhook Endpoint</label>
                      <input type="text" className="form-control" value="https://n8n.internal.vocalassist.ai/webhook/ticket" readOnly />
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer>
            © 2026 VocalAssistAI Vernacular Routing & Resolution Engine • Powered by Gemini AI & Pinecone
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
